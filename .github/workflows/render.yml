name: Render Remotion Video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build

      - name: Create output directory
        run: mkdir -p out

      - name: Render video
        run: npm run render

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-final
          path: out/video-final.mp4
